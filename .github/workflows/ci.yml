# Off-ROS gate: ruff + bare pytest, no ROS install (ADR-0012/0013).
# Python 3.10 = Humble parity; docker/scout-skills (py3.12) sources are only
# ast.parse'd by the conventions tests, and PEP 604 syntax parses fine on 3.10.
name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.3"
          args: check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        working-directory: scout
