# fleet-status is the one image BOTH devices pull (Pi arm64 + companion
# amd64), so it gets its own multi-arch workflow: two single-arch workflows
# pushing the same tag would each overwrite the other's manifest, leaving
# whichever device pulled last with the wrong architecture.
name: fleet-status-image
on:
  push:
    branches: ["**"]
    paths:
      - docker/fleet-status/**
      - .github/workflows/fleet-status-image.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: commit SHA to build
        type: string
        required: true
      branch:
        description: branch name for the mutable tag
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Compute tags
        id: tags
        env:
          SHA: ${{ inputs.ref || github.sha }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          repo=ghcr.io/bg-bgi/scout-fleet-status
          tags="$repo:$SHA,$repo:${BRANCH//\//-}"
          [ "$BRANCH" = "main" ] && tags="$tags,$repo:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same skip as pi-images.yml: :<sha> is immutable, so an existing image
      # means nothing to build; refresh the mutable tags server-side and stop.
      # (imagetools create copies the whole manifest LIST, so both arches
      # survive the retag.)
      - name: Skip if :<sha> already in GHCR
        id: exists
        env:
          SHA: ${{ inputs.ref || github.sha }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          repo=ghcr.io/bg-bgi/scout-fleet-status
          if docker buildx imagetools inspect "$repo:$SHA" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            docker buildx imagetools create -t "$repo:${BRANCH//\//-}" "$repo:$SHA"
            if [ "$BRANCH" = "main" ]; then
              docker buildx imagetools create -t "$repo:latest" "$repo:$SHA"
            fi
            echo "== $repo:$SHA exists — skipped rebuild, refreshed mutable tags"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: ${{ steps.exists.outputs.found != 'true' }}
        with:
          context: docker/fleet-status
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/bg-bgi/scout-fleet-status:buildcache
          cache-to: type=registry,ref=ghcr.io/bg-bgi/scout-fleet-status:buildcache,mode=max
