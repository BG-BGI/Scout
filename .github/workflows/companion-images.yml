# Companion image publishing (ADR-0022 stack). Builds the two companion
# images natively on amd64 runners and pushes to GHCR, so the Debian box
# updates with `docker compose pull` instead of USB tarballs and the Mac
# never runs the 4-10 min QEMU cross-build again.
#
# The box authenticates with a read:packages PAT (SSO-authorized once from a
# browser); the repo itself reaches the box via a read-only deploy key —
# deploy keys are exempt from SAML SSO enforcement.
name: companion-images
on:
  push:
    branches: [main, companion-v1]
    paths:
      - "companion/Dockerfile"
      - "companion/detector/**"
      - "docker/fleet-status/**"
      - ".github/workflows/companion-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: scout-companion
            context: companion
          - image: scout-companion-detector
            context: companion/detector
          # Same source as the Pi's local build; GHCR copy is for the companion.
          - image: scout-fleet-status
            context: docker/fleet-status
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bg-bgi/${{ matrix.image }}:latest
            ghcr.io/bg-bgi/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
