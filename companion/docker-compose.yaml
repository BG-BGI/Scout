# Companion stack (ADR-0022). Runs on a native Linux host — the Debian box.
# It keeps its OWN loopback DDS graph; the only thing that crosses the network
# is zenoh_bridge's single outbound TCP connection to the Pi (corp inter-VLAN
# filtering drops UDP, so plain shared-domain DDS is out — measured 2026-08-20).
#
# .env: PI_IP=<the Pi's address>  (cp .env.example .env)

# Images come from GHCR (built by .github/workflows/companion-images.yml on
# push) — box updates via ./update.sh (git pull + compose pull). The build:
# keys stay for local dev only.
x-companion: &companion
  build: .
  image: ghcr.io/bg-bgi/scout-companion:latest
  network_mode: host
  ipc: host
  environment:
    # Local graph only — the bridge is the sole cross-machine path. Domain
    # matches the Pi (cosmetic across the bridge, load-bearing locally).
    - ROS_DOMAIN_ID=17
    - ROS_LOCALHOST_ONLY=1
  restart: unless-stopped

services:

  # The one network-crossing process: subscribes the allowlisted Pi topics
  # over zenoh/TCP and republishes them into this box's loopback DDS graph.
  # Allowlist: config/zenoh_bridge.json5 (must mirror the Pi side's).
  zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:1.10.0
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=17
      - ROS_LOCALHOST_ONLY=1
      - ROS_DISTRO=humble
      # Cyclone must unicast-ping a wide participant-index range on loopback:
      # Fast DDS under ROS_LOCALHOST_ONLY announces only to indices 0-3 and
      # ignores multicast, so without this the two vendors are mutually deaf
      # (observed: bridge session up, zero routes created).
      - 'CYCLONEDDS_URI=<CycloneDDS><Domain><Discovery><ParticipantIndex>auto</ParticipantIndex><MaxAutoParticipantIndex>120</MaxAutoParticipantIndex><Peers><Peer address="127.0.0.1"/></Peers></Discovery></Domain></CycloneDDS>'
    volumes:
      - ./config/zenoh_bridge.json5:/zenoh_bridge.json5:ro
    command: -c /zenoh_bridge.json5 -e tcp/${PI_IP}:7447

  # Live 3D capture (spec §2.1). Consumes the bridged topics from the local
  # graph exactly as if the camera were local. The compressed encoders on the
  # Pi are per-subscriber lazy — the Pi-side zenoh bridge is that subscriber,
  # so the Pi pays the JPEG/PNG cost only while this stack is up. Visual
  # odometry OFF: the EKF's fused /odom (wheel speed + gyro yaw) is the pose
  # input; rtabmap does appearance-based loop closure on top.
  rtabmap:
    <<: *companion
    depends_on:
      - zenoh_bridge
    volumes:
      - rtabmap_db:/root/.ros
      - ./config:/companion/config:ro
    command: >
      ros2 launch rtabmap_launch rtabmap.launch.py
        rtabmap_args:="--Rtabmap/DetectionRate 1"
        rgb_topic:=/camera/camera/color/image_raw
        depth_topic:=/camera/camera/aligned_depth_to_color/image_raw
        camera_info_topic:=/camera/camera/color/camera_info
        rgb_image_transport:=compressed
        depth_image_transport:=compressedDepth
        visual_odometry:=false
        odom_topic:=/odom
        frame_id:=base_link
        subscribe_scan:=true
        scan_topic:=/scan
        approx_sync:=true
        approx_sync_max_interval:=0.15
        rtabmap_viz:=false
        rviz:=false

  # Local robot_state_publisher (WORLDMODEL.md TF fix). The URDF static chain
  # base_link->...->camera_link does NOT survive the zenoh bridge: /tf_static has
  # two latched publishers on the Pi (rsp + realsense) and transient_local replay
  # over the bridge keeps only the last-received, so only realsense's camera-
  # internal frames reach this box (measured: `tf2_echo base_link camera_link` =
  # two unconnected trees, while `tf2_echo odom base_link` resolves fine — dynamic
  # /tf crosses, static does not). Publishing the URDF LOCALLY is the standard
  # multi-machine pattern and removes all dependence on /tf_static crossing.
  # robot_state_publisher ships in ros-base (this image), so no rebuild. Meshes
  # are irrelevant — kdl_parser reads only links/joints for TF.
  robot_state_publisher:
    image: ghcr.io/bg-bgi/scout-companion:latest
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=17
      - ROS_LOCALHOST_ONLY=1
    volumes:
      - ./description/scout_description.urdf:/urdf/scout_description.urdf:ro
    # Pass the URDF as a positional file path — `--ros-args -p
    # robot_description:=<xml>` cannot parse multiline XML (rcl param-rule
    # parser aborts on the first newline/quote). The positional form loads the
    # file straight into robot_description (Humble-supported).
    command: ros2 run robot_state_publisher robot_state_publisher /urdf/scout_description.urdf

  # World-model detector (WORLDMODEL.md, gate 1). Continuous YOLO11n on the
  # bridged D455 stream -> map-frame object table on /world/objects (latched
  # std_msgs/String JSON). CPU-only, onnxruntime, no torch. Consumes only
  # already-bridged topics (color/depth/info/tf) and publishes LOCALLY — the
  # Pi does not see /world/objects until gate 2 adds it to both allowlists.
  # Own build context (./detector), NOT the &companion anchor, but the same
  # local-graph env so it shares this box's DDS with rtabmap.
  detector:
    build: ./detector
    image: ghcr.io/bg-bgi/scout-companion-detector:latest
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - zenoh_bridge
    environment:
      - ROS_DOMAIN_ID=17
      - ROS_LOCALHOST_ONLY=1

  # Local Foxglove bridge (:8766) — view /rtabmap/cloud_map from this box
  # without hauling the cloud back through the Pi's :8765.
  foxglove_bridge:
    <<: *companion
    command: ros2 run foxglove_bridge foxglove_bridge --ros-args -p port:=8766

volumes:
  rtabmap_db:
