# Config for wimblerobotics/roboclaw_driver (roboclaw_driver_node).
# The top-level key must match the node name ("roboclaw_driver").
# Launch: ros2 launch roboclaw_driver roboclaw_driver.launch.py \
#           config_file:=/ros_ws/src/scout/config/roboclaw.yaml
roboclaw_driver:
  ros__parameters:
    # --- serial link (GPIO14/15 UART, RoboClaw addr 128) ---
    device_name: "/dev/ttyAMA0"
    baud_rate: 115200
    device_timeout: 100

    # --- publish rates (Hz) ---
    odometry_rate: 67.0
    joint_states_rate: 30.0
    status_rate: 10.0

    # --- drive geometry ---
    # Re-verified 2026-08-14 after the operator deliberately DEFLATED all four tires
    # (traction fix): 2 m out-and-back on hard floor, tape 2.0066 m vs /wheel_odom
    # 1.9896/1.9958 m per leg → wheels under-report +0.70%, robot returned to the mark
    # within 0.5 in. 0.0775 × 1.007 = 0.0780. Direction matches deflation (smaller
    # effective rolling radius); magnitude is tiny — these tires barely deflect even soft.
    # Re-run the tape test if pressure is ever changed again.
    wheel_radius: 0.0780              # m (was 0.0775 at full inflation)
    # Track (L-R) taken from the CAD in scout_description: the wheel joints sit at
    # x = +/-0.111 on the hub face, and the wheel mesh is 0.05617 m thick, so the
    # centerlines are 2 * (0.111 + 0.05617/2) = 0.2782 m apart. Wheelbase (F-B) is
    # 0.179 m. This replaces an earlier 0.290 m tape measurement.
    # Skid-steer: all 4 tires scrub sideways in a turn, so odometry over-reports rotation
    # and turns are under-driven. This is the geometric starting point; calibrate UP from
    # it (the 0.179 m wheelbase makes turns fight harder) by commanding an in-place 360 deg
    # spin and increasing until reported yaw matches reality.
    wheel_separation: 0.278
    # Pololu #4693: 64 CPR motor shaft x 50:1 = 3200 counts per wheel revolution (CLAUDE.md).
    encoder_counts_per_revolution: 3200

    base_frame: "base_link"
    odom_frame: "odom"

    # --- limits ---
    # rad/s (commanded). Measured true in-place yaw ~= 0.71 * commanded (skid-steer scrub:
    # 2.75 real rev vs 3.89 odom rev over 12 s @ 2.0 rad/s). NOTE: driver does NOT normalize
    # the wheel pair, so a turn can only be driven with whatever duty the linear speed leaves
    # over — see max_linear_velocity below (in-place pivots are unaffected).
    #
    # 3.0 is a SURFACE COMPROMISE, not a hardware limit — the ceiling is duty, and how much
    # duty a pivot costs depends entirely on the floor (see CLAUDE.md "Pivot duty ceiling").
    # Measured forward-side motor volts (duty x pack V) needed to hold the commanded spin:
    #   hard floor: 11.1 V @ 3.0, 13.4 V @ 4.0  -> never saturates, pivot is clean at any speed
    #   carpet:     14.8 V @ 3.0, 17.3 V @ 4.0  -> 4.0 pins at 100% duty ~20% of the time,
    #                                              falls behind, and walks ~2.5 cm/rev
    # 3.0 keeps carpet just off the stop on a fresh/mid pack; it will start clipping on carpet
    # late in discharge (needs 14.8 V of a sagging 16 V pack = 93% duty). Drop to 2.5 if clean
    # carpet pivots at any battery state matter more than spin speed. 4.0 is fine on hard floors.
    max_angular_velocity: 3.0
    # m/s (~6571 counts/s). Straight-line duty is linear at ~15 V of motor volts per m/s
    # (measured on hard floor, 19.1 V pack; see CLAUDE.md "Straight-line duty"):
    #   0.3 -> 4.8 V (25% duty)   0.9 -> 13.9 V (72%)   1.2 -> 18.3 V (96%, peaks pinned at 100%)
    #   0.6 -> 9.4 V (49%)        1.0 -> 15.3 V (80%)
    # 1.0 needs 15.3 V, so it is reachable at 100% duty down to a ~15.7 V pack — i.e. it never
    # clips anywhere in the usable range, and tracking held 100% of target with 0.3% ripple.
    # 1.2 needs ~18.6 V and is only reachable above a ~18.8 V pack (top third of the discharge);
    # below that the robot silently drives slower than commanded, which corrupts odometry.
    # The deciding factor is turning authority, not straight-line speed: the driver does not
    # normalize the wheel pair, so leftover duty is all the outer wheel has for a turn. At 1.0
    # the spare 20% is worth ~1.2 rad/s of true yaw at full speed; at 1.2 the spare 4% is worth
    # ~0.24 rad/s, so turns taken at top speed come out wider than commanded.
    max_linear_velocity: 1.0
    # Must exceed the cmd_vel period or the robot stops between commands. At 10 Hz that is
    # 0.1 s, so 0.2 s gives margin (also matches the RoboClaw 0.2 s deadman).
    max_seconds_uncommanded_travel: 0.2

    # --- velocity PID + QPPS (CLAUDE.md autotune, saved to NVM at ~20.3 V full pack) ---
    m1_p: 5.76070
    m1_i: 0.33235
    m1_d: 0.0
    m1_qpps: 9240
    m2_p: 5.96193
    m2_i: 0.35071
    m2_d: 0.0
    m2_qpps: 9240
    # accel doubles as the top-speed limiter: the driver sends MIXEDSPEEDACCELDIST with a
    # distance cap of (commanded counts/s * max_seconds_uncommanded_travel). The move must
    # decelerate to a stop within that window, so reachable speed ~= sqrt(2*accel*V*T).
    # To actually hit a commanded V, need accel >= V/(2*T): at 1.0 m/s (~6571 counts/s) and
    # T=0.2 s that is ~16400, so 20000 has margin. 3000 capped the robot near ~0.3-0.4 m/s.
    # Verified: with the cap on, 10 Hz and 30 Hz cmd_vel both reached the same speed as
    # uncapped, with no dips — so cadence is not a straight-line limiter at this accel.
    # MIXEDSPEEDACCELDIST still ramps (not an instant sign flip). Dial down toward 12000-16000
    # if starts feel too abrupt (but keep accel >= max_linear_counts/0.4 or top speed re-clips).
    #
    # 40000 (~6 m/s^2 chassis) raised from 20000 for trick punch: at 20000 (~3 m/s^2) the
    # wheelie's reverse->forward flip ramps over ~0.65 s and the nose never unloads; ~5 m/s^2
    # is the rough lift threshold with the rear-mounted pack. Cost: teleop starts are jerkier
    # and hard launches can break traction (burnout trick relies on exactly that). Drop back
    # to 20000 if normal driving feels too abrupt.
    accel: 40000                       # counts/s^2

    # --- outputs ---
    publish_odom: true                 # remapped to /wheel_odom; it feeds the EKF
    # The EKF owns odom->base_link now (see config/ekf.yaml). Two publishers of the
    # same transform would fight, and the driver's yaw is the one being replaced.
    publish_tf: false
    publish_joint_states: true
    do_debug: false                    # set true only for verbose bring-up debugging
    do_low_level_debug: false
