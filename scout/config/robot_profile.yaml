# Scout robot profile — SINGLE SOURCE OF TRUTH for cross-surface constants.
#
# These values used to be copy-pasted across the ROS nodes (joystick_teleop,
# led_node/led_status, link_watchdog), the webui
# (app.js / index.html), the scout-skills MCP server (motion.py, server.py,
# render.py) and Foxglove.json — and had already DRIFTED apart (five different
# angular floors, a stale pivot clamp, mismatched LED-mode lists). Anything a
# reader must agree on with another surface belongs here; per-node UX tunables
# (teleop slider steps) stay in the node.
#
# ⚠ CONSTRAINTS (the webui parses this file with a deliberately tiny parser):
#   * flat scalar keys only — NO nested maps
#   * lists in JSON flow style only — [a, b, c]
#
# Consumers:
#   * scout nodes            -> scout/scout/robot_profile.py (load())
#   * scout-skills MCP       -> docker/scout-skills/robot_profile.py (mounted ro)
#   * webui                  -> app.js fetch('robot_profile.yaml') + mini-parser
#                               (compose bind-mounts THIS file into /webui)
#   * Foxglove.json          -> CANNOT consume (static JSON); its teleop rate and
#                               button values are hand-mirrored — a known limit.
#
# roboclaw.yaml stays authoritative for the DRIVER; the velocity caps below MUST
# match roboclaw.yaml's max_linear_velocity / max_angular_velocity (and its
# max_seconds_uncommanded_travel = the deadman). Keep them in step.
robot_profile:
  # --- velocity envelope ---
  linear_cap: 1.0          # m/s   (= roboclaw.yaml max_linear_velocity)
  angular_cap: 3.0         # rad/s (= roboclaw.yaml max_angular_velocity)
  linear_floor: 0.05       # m/s   velocity-loop quantization floor (ADVISORY, not a clamp)
  angular_floor: 0.35      # rad/s DWB min_speed_theta twin           (ADVISORY, not a clamp)
  recommended_pivot: 2.5   # rad/s pivot rate where position matters — a WALK MINIMIZER,
                           #       never a clamp (the retired flat-tire stall floor)

  # --- cmd_vel contract ---
  publish_hz: 25.0         # teleop/webui stream rate (> 1/deadman)
  stop_grace_s: 0.3        # zero-Twist burst on release, then silence
  deadman_s: 0.2           # RoboClaw stops if no packet for this long (= roboclaw.yaml)
  source_timeout_s: 0.5    # twist_mux per-input staleness (keep twist_mux.yaml in step)

  # --- cmd_vel topics (two-stage mux — keep in step with twist_mux.yaml
  #     and twist_mux_auto.yaml) ---
  # Autonomous:  skills/nav -> twist_mux_auto -> /cmd_vel_auto
  #              -> collision_monitor -> /cmd_vel_safe (guarded)
  # Human+final: joystick, web, /cmd_vel_safe, estop brake -> twist_mux
  #              -> /cmd_vel_out -> traction_monitor -> /cmd_vel_trac
  #              -> roboclaw_driver. Teleop bypasses the CM.
  topic_cmd_vel_out: "/cmd_vel_out"      # FINAL mux output -> traction_monitor
  topic_cmd_vel_auto: "/cmd_vel_auto"    # autonomous mux output -> collision_monitor
  topic_cmd_vel_safe: "/cmd_vel_safe"    # collision_monitor -> final mux `auto` (prio 10)
  topic_cmd_vel_joy: "/cmd_vel_joy"      # joystick_teleop  (prio 100, bypasses CM)
  topic_cmd_vel_web: "/cmd_vel_web"      # webui + Foxglove (prio 90, bypasses CM)
  topic_cmd_vel_skills: "/cmd_vel_skills"  # scout-skills motion (auto prio 40)
  topic_cmd_vel_stop: "/cmd_vel_stop"    # estop active-brake input (final prio 255)
  topic_estop: "/estop"                  # twist_mux lock (Bool)
  # nav2 keeps publishing plain /cmd_vel as the lowest-priority (10) autonomous input.

  # --- camera topics ---
  topic_camera_color: "/camera/camera/color/image_raw/compressed"
  topic_camera_info: "/camera/camera/color/camera_info"

  # --- nav ---
  goal_tolerance_m: 0.15   # = nav2.yaml xy_goal_tolerance (base profile)
  # action_msgs/GoalStatus by code (friendly names the UIs already show):
  goal_status_names: ["unknown", "accepted", "driving", "canceling", "arrived", "canceled", "aborted"]

  # --- LED ---
  led_modes: ["off", "solid", "blink", "breathe", "rainbow", "chase"]

  # --- battery threshold ladder (see battery_monitor / led_status) ---
  battery_warn_v: 17.5
  battery_critical_v: 16.5
  battery_activity_floor_v: 17.0   # patrol aborts below this

  # --- map rendering ---
  occupied_threshold: 50   # nav2 lethal convention (render.py + webui split)

  # --- rosbag record-on-demand (bag_recorder, ADR-0017) ---
  # Cross-surface: skills MCP + webui trigger recordings; the default topic
  # set is the diagnosis kit (odom chain, scan, cmd_vel, health). Override per
  # run with `ros2 param set /bag_recorder topics "[...]"` before /record/start.
  record_topics: ["/odom", "/wheel_odom", "/imu/data", "/scan", "/cmd_vel_out", "/cmd_vel_trac", "/traction/status", "/roboclaw_status", "/battery", "/diagnostics", "/tf", "/tf_static"]
  # Auto-stop guard: bag splitting is banned (Humble split-playback bug), so
  # the node SIGINTs the recorder itself after this long. Raise deliberately
  # for long captures.
  record_max_duration_s: 600
