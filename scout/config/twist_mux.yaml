# twist_mux (FINAL stage): the human-override arbiter. Merges the two HUMAN
# teleop sources with the collision-guarded autonomous stream and the e-stop
# brake, and forwards the winner straight to the driver — teleop does NOT pass
# through the collision monitor (operator decision 2026-08-17).
#
# Two-stage topology (ADR-0001 rev, ADR-0016 rev):
#   autonomous:  trick/follow/skills/nav -> twist_mux_auto -> /cmd_vel_auto
#                -> collision_monitor -> /cmd_vel_safe  (guarded)
#   human:       joystick, web  ------------------------------\
#   guarded auto:/cmd_vel_safe  (prio 10) --------------------- THIS mux -> /cmd_vel_out -> roboclaw
#   brake:       /cmd_vel_stop (prio 255)
# So the collision monitor still vetoes every AUTONOMOUS source, while a human
# on the joystick or the webui keeps full authority (they can see the robot).
# See scout/config/twist_mux_auto.yaml and collision_monitor.yaml.
#
# Priorities: brake > physical operator (joystick) > remote human (web) >
# collision-guarded autonomous. The `stop` input sits ABOVE the estop lock so
# the estop node can actively brake through an engaged lock (see locks + ADR-0001).
twist_mux:
  ros__parameters:
    topics:
      stop:
        topic: /cmd_vel_stop
        timeout: 0.5
        priority: 255
      joystick:
        topic: /cmd_vel_joy
        timeout: 0.5
        priority: 100
      web:
        topic: /cmd_vel_web
        timeout: 0.5
        priority: 90
      auto:
        # Collision-monitor output: the guarded merge of every autonomous
        # source (twist_mux_auto -> collision_monitor -> /cmd_vel_safe).
        topic: /cmd_vel_safe
        timeout: 0.5
        priority: 10
    locks:
      # estop lock blocks every input BELOW priority 200 (joystick 100, web 90,
      # auto 10) — human teleop included — but the stop input at 255 stays above
      # it so /cmd_vel_stop can pass for active braking while everything else is
      # locked out. The e-stop still binds teleop; only the collision monitor
      # was removed from the teleop path.
      #
      # Fail-safe: the estop node publishes /estop at 5 Hz, so a 1.0 s timeout
      # means a dead estop node (no heartbeat) goes stale = LOCKED and parks the
      # robot rather than leaving it drivable.
      estop:
        topic: /estop
        timeout: 1.0
        priority: 200
