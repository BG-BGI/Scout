# Tight-tunnel deltas over nav2.yaml (ADR-0010): corridors barely wider than the
# chassis, fast in-place pivots (>=2.5 rad/s minimizes pivot walk on the deflated
# tires), reverse for dead ends, and a lidar-only local/global costmap (depth OA
# off — walls fill the depth FOV and mark the corridor lethal).
#
# Only the differences live here; the base rationale stays in nav2.yaml. Merged
# by robot_profile.merged_params: a dict recurses, a LIST or scalar REPLACES (so
# the shorter `plugins` lists are how depth_layer is dropped), and the inherited
# depth_layer.* subtree is left inert (Costmap2DROS only builds layers named in
# `plugins`). observation_persistence is deliberately NOT overridden — the tight
# profile inherits the base's chair-leg flicker damping (ADR-0010 decision).
bt_navigator:
  ros__parameters:
    # Scout BackUp-at-0.10 m/s recovery tree (above the drivetrain floor).
    default_nav_to_pose_bt_xml: "/ros_ws/src/scout/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
controller_server:
  ros__parameters:
    progress_checker:
      movement_time_allowance: 15.0
    general_goal_checker:
      xy_goal_tolerance: 0.08
    FollowPath:
      forward_sampling_distance: 0.2
      rotate_to_heading_angular_vel: 2.5
      max_angular_accel: 5.0
      max_vel_x: 0.35
      max_speed_xy: 0.35
      min_vel_x: -0.15          # reverse for dead-end backtrack
      max_vel_theta: 2.5
      acc_lim_theta: 5.0
      decel_lim_theta: -5.0
      xy_goal_tolerance: 0.08
      ObstacleFootprint.scale: 0.01
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["obstacle_layer", "inflation_layer"]   # drops depth_layer
      inflation_layer:
        inflation_radius: 0.17
        cost_scaling_factor: 15.0
global_costmap:
  global_costmap:
    ros__parameters:
      resolution: 0.025   # cosmetic; inherits slam overlay's grid via /map
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      inflation_layer:
        inflation_radius: 0.17
        cost_scaling_factor: 15.0
behavior_server:
  ros__parameters:
    max_rotational_vel: 2.5
    rotational_acc_lim: 5.0
velocity_smoother:
  ros__parameters:
    max_velocity: [0.35, 0.0, 2.5]
    min_velocity: [-0.35, 0.0, -2.5]
    max_accel: [1.5, 0.0, 5.0]
    max_decel: [-2.0, 0.0, -5.0]
