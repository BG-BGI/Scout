# Nav2: path planning and following, with collision avoidance from the lidar alone.
#
# Launched by the compose `nav2` service through upstream's navigation_launch.py, which
# starts eight lifecycle nodes (controller_server, smoother_server, planner_server,
# behavior_server, bt_navigator, waypoint_follower, velocity_smoother and the lifecycle
# manager) and owns the cmd_vel plumbing: controller_server's output is remapped to
# /cmd_vel_nav and velocity_smoother's back to /cmd_vel, so the roboclaw_driver needs no
# change. There is deliberately no amcl or map_server section here — slam_toolbox fills
# both roles, publishing /map and owning map->odom.
#
# Every top-level key must match a node name. The two costmaps are child nodes of
# controller_server and planner_server, hence the doubled local_costmap/global_costmap
# nesting; that is not a typo.
#
# Inputs: /scan (lidar), /map (slam_toolbox), and the full TF chain
# map->odom->base_link->laser. Nav2 publishes NO transforms of its own — if a fourth
# /tf publisher appears after starting this, something is misconfigured.
#
# ⚠ THE WHOLE FILE IS TUNED FOR TIGHT CLEARANCE. This robot will eventually drive
# through pipes barely wider than itself, so it must be willing to pass within
# centimetres of a wall. The way that is achieved is NOT by shrinking the robot or
# disabling safety, but by moving the collision decision from "cost under the robot's
# centre" (upstream's default, which is really a distance-from-obstacle penalty) to
# "does the actual footprint polygon overlap an actual obstacle cell". See the footprint
# and inflation comments in local_costmap, and the ObstacleFootprint critic in
# controller_server.
#
# Launch: ros2 launch nav2_bringup navigation_launch.py \
#           params_file:=/ros_ws/src/scout/config/nav2.yaml use_sim_time:=false

# ------------------------------------------------------------------------------------
# bt_navigator — runs the navigation behavior tree and accepts goals
# ------------------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    # ⚠ base_link, not upstream's base_footprint, which scout_description.urdf does not
    # define. Same trap as slam.yaml's base_frame: base_link already sits at floor level.
    robot_base_frame: base_link
    # The fused EKF output, not the driver's raw /wheel_odom.
    odom_topic: /odom
    # ⚠ BOTH ARE RAISED OFF THE UPSTREAM DEFAULTS (10 / 20), WHICH FAIL EVERY GOAL HERE.
    # default_server_timeout is the milliseconds a BT action client waits for a server to
    # ACKNOWLEDGE a goal — not to complete it. Across DDS between the eight nav2 processes
    # on a loaded Pi 5, first-call latency exceeds 20 ms every time, so compute_path_to_pose,
    # both costmap-clear services, spin, wait and backup all timed out in sequence and the
    # tree burned its whole recovery branch and aborted 167 ms after accepting the goal. The
    # servers were fine and answered late: spin reported success 3.7 s after the abort.
    #
    # Raising this cannot mask a genuinely hung server — the BT still fails, just later.
    #
    # bt_loop_duration 10 asks for a 100 Hz tick this machine cannot hold ("Behavior Tree
    # tick rate 100.00 was exceeded"). 20 ms / 50 Hz still far outruns the tree's own 1 Hz
    # RateController replanning, so nothing downstream gets slower.
    bt_loop_duration: 20
    default_server_timeout: 200
    wait_for_service_timeout: 1000

    # default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml are left unset, which
    # selects nav2_bt_navigator's navigate_to_pose_w_replanning_and_recovery.xml: replan
    # at 1 Hz, and on failure round-robin through clear-costmaps, Spin(1.57 rad),
    # Wait(5 s) and BackUp(0.30 m at 0.05 m/s).
    #
    # ⚠ That BackUp speed of 0.05 m/s sits right ON this drivetrain's velocity-loop floor
    # (~0.046-0.077 m/s, where the encoder delivers ~1 count per control tick), so the
    # recovery may barely move or not move at all. If that turns out to matter, copy the
    # upstream XML to /ros_ws/src/scout/behavior_trees/ with backup_speed ~0.10 and point
    # default_nav_to_pose_bt_xml at the absolute path.
    #
    # Goals arrive from Foxglove on /goal_pose (frame_id: map); bt_navigator subscribes to
    # it and forwards to its own NavigateToPose action.

    # ⚠ Humble requires every BT node plugin to be listed explicitly — an unlisted node
    # makes the tree fail to parse at the first goal, not at startup. This is upstream's
    # full list, unmodified.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

# bt_navigator spins up one internal rclcpp node per navigator type; these exist only so
# the clock setting reaches them.
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ------------------------------------------------------------------------------------
# controller_server — the local planner, and the only thing that commands motion
# ------------------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: false

    # 15 Hz rather than upstream's 20: DWB with footprint-polygon collision checking is
    # the most expensive thing in this file, and the RoboClaw's 200 ms deadman is fed by
    # velocity_smoother's 30 Hz output, not by this rate. Raise it only if the robot
    # feels laggy AND `top` shows headroom.
    controller_frequency: 15.0

    # Below these the current velocity is read as zero when deciding what the robot is
    # doing. y is huge because this is a differential drive and never moves sideways.
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001

    # Tolerate 0.3 s of "no valid trajectory" before failing the FollowPath action and
    # handing over to the recovery behaviors.
    failure_tolerance: 0.3

    # The fused odometry, used by the rotation shim's closed-loop velocity ramp.
    odom_topic: /odom

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Loosened from upstream's 0.5 m / 10 s, then the allowance doubled again on
      # 2026-08-14: the deflated tires scrub 1.6-1.9x in pivots, so pivot-heavy phases
      # legitimately translate <0.25 m for tens of seconds and 15 s was aborting real
      # progress ("Failed to make progress" in a cluttered office). The trade is that a
      # genuine stall now takes 30 s to notice.
      required_movement_radius: 0.25
      movement_time_allowance: 30.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      # Upstream's 0.25 m is most of this robot's 0.334 m width, i.e. "close enough" would
      # be nearly a robot away. Must stay equal to FollowPath.xy_goal_tolerance below,
      # which is what the RotateToGoal critic reads.
      xy_goal_tolerance: 0.15
      # 0.25 rad = 14 deg. Not tighter: the final yaw is approached at a rotation rate the
      # drivetrain can actually track (see min_speed_theta), so there is some overshoot.
      yaw_goal_tolerance: 0.25

    FollowPath:
      # ⚠ Two controllers in one block. The rotation shim is a wrapper: when the path
      # starts off at more than angular_dist_threshold from the current heading, it turns
      # in place first and only then hands off to the primary controller, whose parameters
      # live in this SAME namespace (that is how the shim loads them). A skid-steer that
      # pivots freely should always rotate onto the path rather than arc onto it, and in a
      # pipe there is no room to arc at all.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"

      # --- rotation shim ---------------------------------------------------------------
      # 0.785 rad = 45 deg. Below that, skip the pivot and let DWB drive onto the path.
      angular_dist_threshold: 0.785
      # How far along the path to look for the heading to rotate to. 0.3 m rather than the
      # 0.5 m default because the whole robot is only 0.337 m long, so 0.5 m reaches past
      # the first turn in tight quarters and would aim at the wrong thing.
      forward_sampling_distance: 0.3
      # 2.0, raised from 1.2 on 2026-08-14 for the deflated tires: measured pivot scrub
      # is 1.6-1.9x (wheel yaw vs gyro yaw), so a commanded 1.2 delivers only ~0.6-0.75
      # rad/s of real chassis rotation and pivot phases crawled. 2.0 restores roughly the
      # originally intended real rate, and higher rates also measurably reduce pivot walk
      # (~10 cm/rev at 1.5 vs ~2.5 cm at 2.5). Keep in step with max_vel_theta and
      # behavior_server's max_rotational_vel.
      rotate_to_heading_angular_vel: 2.0
      max_angular_accel: 2.5
      # Refuse the pivot if the footprint would sweep into something within 1 s.
      simulate_ahead_time: 1.0
      # Also pivot in place for the FINAL heading instead of asking DWB to do it. Same
      # argument: pivoting is what this chassis is good at.
      rotate_to_goal_heading: true

      # --- DWB: kinematics -------------------------------------------------------------
      debug_trajectory_details: True
      # 0.35 m/s (lowered from 0.6 on 2026-08-17 — robot wedged on a thin table leg; at
      # 0.6 the leg strobed in the local costmap faster than observation_persistence 1.0
      # could hold it, and stopping distance was too long). 0.6 was raised 2026-08-14 for
      # LLM-driven operation feeling timid, but thin-obstacle marking is the binding
      # constraint on open floor with furniture. Scan smear at 12.3 Hz is ~3 cm/rev at
      # 0.35 (was ~5 cm at 0.6). The tight_tunnel overlay already pins 0.35 for precision.
      # If detection holds at 0.35, raise local obstacle_layer observation_persistence
      # (1.0 -> ~2.0) as the durable fix, then this can go back up.
      max_vel_x: 0.35
      max_speed_xy: 0.35
      # ⚠ Reverse is OFF for now (0.0, so DWB only samples forward motion and in-place
      # rotation). A pipe with no room to turn around will eventually need it — set this
      # to about -0.15 and expect DWB to be mediocre at it, since it only samples
      # constant-curvature arcs; MPPI is the real answer for reversing maneuvers. Backing
      # out of a dead end today is handled by the recovery BT's BackUp instead.
      min_vel_x: 0.0
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_vel_theta: 2.0

      # ⚠ THE DRIVETRAIN VELOCITY FLOOR, enforced here rather than as a smoother deadband.
      # CLAUDE.md: below ~300-500 counts/s the encoder yields ~1 count per control tick
      # and the velocity loop is quantization-limited, i.e. ~0.05 m/s of forward speed, or
      # ~0.35 rad/s for an in-place pivot (2 * 0.05 / 0.278 m track).
      # KinematicParameters::isValidSpeed rejects a sample only when it is below BOTH of
      # these, so a pure slow rotation and a straight slow crawl both stay legal while
      # "barely creeping AND barely turning" — which the hardware cannot track and which
      # reads as a mysterious stall — is thrown out.
      # This is also why velocity_smoother.deadband_velocity stays at zero: a deadband
      # would additionally chop the smoother's own acceleration ramp through these values.
      min_speed_xy: 0.05
      min_speed_theta: 0.35

      # The RoboClaw's own accel is 20000 counts/s^2 = 3.04 m/s^2 (6572 counts per metre),
      # so asking for more than that would be a command the hardware silently reshapes.
      # These sit well under it; they also set how far the sampled velocity window can
      # move per control cycle, so do not shrink them much further or the robot becomes
      # sluggish to respond.
      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.5
      decel_lim_x: -2.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.5

      # --- DWB: trajectory sampling ----------------------------------------------------
      # 1.5 s of lookahead is 0.52 m at full speed, i.e. about 1.5 robot lengths.
      sim_time: 1.5
      # Trimmed from upstream's 20x20: every extra sample is a full footprint-polygon
      # collision check per pose. vtheta_samples is ODD on purpose — the theta range is
      # symmetric, so an odd count includes exactly 0.0, which is what makes
      # perfectly-straight trajectories available.
      vx_samples: 12
      vtheta_samples: 21
      # Must be > 0; with max_vel_y = min_vel_y = 0 every sample is vy=0, so 1 is enough.
      vy_samples: 1
      # Distance/angle between poses along a candidate trajectory. Linear matches the
      # local costmap's 0.025 m cells so no cell is skipped. Angular is relaxed from
      # upstream's 0.025 rad to 0.05 (2.9 deg) because a full-speed pivot would otherwise
      # generate ~72 poses to footprint-check, for finer detail than a 0.34 m robot needs.
      linear_granularity: 0.025
      angular_granularity: 0.05
      # ⚠ 0.5, NOT upstream's 0.2, because this lookup crosses map->odom, which
      # slam_toolbox publishes in bursts: it was measured 606 ms stale mid-goal while
      # scan-matching (transform stuck while requests advanced), which threw
      # "Extrapolation Error ... map to odom" every cycle until Controller patience
      # exceeded killed the goal.
      #
      # This costs almost no accuracy. map->odom is a slowly-varying CORRECTION term,
      # so a half-second-old one is nearly identical to the current one; all the fast
      # motion rides on odom->base_link from the EKF, which stays fresh and is still
      # held to 0.2 by the local costmap below.
      transform_tolerance: 0.5

      # Must match general_goal_checker.xy_goal_tolerance; the RotateToGoal critic uses
      # this to decide it has arrived and should now only rotate.
      xy_goal_tolerance: 0.15
      # "Translation has stopped" threshold for that handover. Above the 0.05 m/s floor,
      # since the robot cannot meaningfully move slower than that anyway.
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True

      # Keep the transformed plan short; only the next metre matters to a local planner.
      prune_plan: True
      prune_distance: 1.0

      # Debug output: the plans are cheap and useful in Foxglove. The full trajectory
      # marker array and the per-cycle LocalPlanEvaluation are a firehose (hundreds of
      # trajectories at 15 Hz) and are off — turn them on only while actively debugging.
      publish_global_plan: True
      publish_transformed_plan: True
      publish_local_plan: True
      publish_trajectories: False
      publish_evaluation: False
      publish_cost_grid_pc: False

      # --- DWB: critics ----------------------------------------------------------------
      # ⚠ ObstacleFootprint REPLACES upstream's BaseObstacle, and that single swap is the
      # core of "not afraid to get close". BaseObstacle scores the one costmap cell under
      # base_link, so with any inflation at all it is really a distance-from-wall penalty
      # — inside a pipe the centre cell is permanently inflated and the robot would refuse
      # to be where it has to be. ObstacleFootprint instead rasters the ORIENTED FOOTPRINT
      # POLYGON and rejects a trajectory only when that polygon actually covers a lethal
      # cell. Passing 2 cm from a wall scores the same as passing 20 cm from it.
      # Its scale stays tiny (0.02, upstream's value) precisely so the residual inflation
      # gradient is a nudge and never a veto.
      # PreferForward is deliberately absent: nothing should penalise the direction of
      # travel on a symmetric chassis with a 360 deg scanner.
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.02
      # Score the worst pose along the trajectory rather than the sum, so one grazing pose
      # cannot be averaged away by a long safe tail.
      ObstacleFootprint.sum_scores: False
      # Path following dominates: in a corridor barely wider than the robot, the planned
      # centreline is the only safe line, so tracking it beats every other consideration.
      PathAlign.scale: 32.0
      PathDist.scale: 32.0
      GoalAlign.scale: 24.0
      GoalDist.scale: 24.0
      # How far ahead of base_link the align critics measure from. 0.1 m, not the 0.325 m
      # default, which is nearly this robot's whole length and makes it cut corners.
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.1
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# ------------------------------------------------------------------------------------
# local_costmap — rolling window around the robot, live lidar only, drives the controller
# ------------------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true

      # ⚠ width/height are declared as INTEGERS (metres). 3.0 here is a type error that
      # shows up as the parameter being rejected at configure time, not as a warning.
      # 3 m is ~9 robot lengths and comfortably covers DWB's 0.52 m lookahead.
      width: 3
      height: 3
      # Finer than the 0.05 m map, because clearance is the whole game: at 0.05 m a
      # pipe's usable width quantises in 5 cm steps, and the difference between fitting
      # and not fitting is one cell. 3x3 m at 0.025 m is only 120x120 cells, so this is
      # cheap. (The global costmap cannot do the same — see there.)
      resolution: 0.025
      # 12.3 Hz of scan in; no point updating faster than the data arrives.
      update_frequency: 10.0
      # Only for Foxglove; the controller reads the costmap directly, not the topic.
      publish_frequency: 2.0
      # True for Foxglove testing (full OccupancyGrid each publish). Foxglove does not
      # apply /costmap_updates, so False looks like an empty map. TODO: set False again
      # once viz is sorted — saves DDS/CPU; controller never reads this topic.
      always_send_full_costmap: True
      # Deliberately still 0.2 where the controller and global costmap are 0.5: this
      # costmap's global_frame is odom, so it never touches the bursty map->odom. Its
      # chain is the EKF's odom->base_link, which is fast and steady, and holding a
      # tight tolerance on the map used for collision checking is worth keeping.
      transform_tolerance: 0.2

      # ⚠ THE REAL FOOTPRINT, not upstream's robot_radius. Half-extents from the mesh
      # bounds in CLAUDE.md: 0.337 m long x 0.334 m wide, so +/-0.169 x +/-0.167, and the
      # widest and longest parts are the tires. This matters twice over:
      #  - the polygon is what ObstacleFootprint checks, so collision is judged against
      #    the true shape instead of a circle that is 32% too big in the corners;
      #  - the INSCRIBED radius derived from it (0.167, vs 0.22 for the upstream circle)
      #    is what InflationLayer marks as absolutely lethal, and therefore what decides
      #    the narrowest gap that can be planned through at all.
      # Re-derive it if anything is ever bolted on outboard of the wheels.
      footprint: "[[0.169, 0.167], [0.169, -0.167], [-0.169, -0.167], [-0.169, 0.167]]"
      # No slop. Upstream's 0.01 m would silently give away a centimetre in every
      # direction, which in a pipe is a real fraction of the clearance.
      footprint_padding: 0.0

      # No static_layer: this costmap is deliberately a live view in the odom frame.
      # Lidar (mark+clear) and depth (mark-only) MUST be separate ObstacleLayers.
      # Same layer: lidar beams that pass *over* a low obstacle (shoe in a doorway) to a
      # wall behind raytrace those cells free and wipe the depth marks — robot then
      # plans/drives through. Depth stays local-only for CPU.
      plugins: ["obstacle_layer", "stvl_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        # Clear the robot's own footprint every cycle, so a stray return on the chassis
        # cannot trap it.
        footprint_clearing_enabled: True
        # Overwrite the master grid where this layer has an opinion (default 1 = maximum).
        combination_method: 1
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          # 1.0 s of observation persistence (2026-08-14): thin chair legs return
          # specularly and intermittently, so their marks strobed in and out and DWB
          # alternated between "path clear" and "footprint hits obstacle". Holding each
          # observation for ~12 scans keeps flickery marks steady; the cost is obstacles
          # lingering ~1 s after they really move.
          observation_persistence: 1.0
          # No QoS trap here: nav2's observation buffer subscribes with sensor-data QoS
          # (best effort) and rplidar_node publishes RELIABLE, which is compatible. This
          # is the opposite of the /imu/data case in ekf.yaml.
          #
          # The lidar reads to 16 m but this costmap is only 3 m across; anything beyond
          # it is the global costmap's business.
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          # Planar scan, so height gating is meaningless — accept everything.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          # ⚠ false: a beam that returns nothing (inf) does NOT clear space out to
          # raytrace_max_range. Deliberate, and the safer half of a real trade-off. This
          # lidar misses dark and glancing surfaces, and treating a non-return as "the
          # way is clear" is exactly how a robot drives into a black baseboard. The cost
          # is that an obstacle which vanishes from view lingers in the costmap until
          # something is seen behind it; set true if stale obstacles become the problem.
          inf_is_valid: false

      # Under-lidar band via STVL (2026-08-24, replaced the ObstacleLayer
      # depth_mark/depth_clear pair AND the Python clutter_mapper node — C++,
      # in-process, so the per-cloud Python deserialization cost is gone).
      # Own layer so lidar raytrace cannot wipe low marks (the doorway
      # drive-over bug). Marks only the 0.05–0.22 m band; clearing is
      # frustum-based (decay_acceleration) instead of raytrace — space the
      # camera can currently see decays fast, so removing a shoe frees cells
      # as soon as the camera looks at where it was.
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_decay: 15.0        # live local view: marks last 15 s unseen
        decay_model: 0           # linear
        voxel_size: 0.025        # match this costmap's resolution
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: True
        combination_method: 1
        obstacle_range: 1.2
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.3
        mapping_mode: false
        observation_sources: depth
        depth:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 0.22
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
          # D455 depth FOV 87°x58° -> radians; frustum clearing needs these.
          vertical_fov_angle: 1.012
          horizontal_fov_angle: 1.518
          decay_acceleration: 5.0
          model_type: 0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # ⚠ THE "DO NOT BE AFRAID" DIALS. Inflation cannot make a gap passable or
        # impassable — cells within the inscribed radius (0.167 m, from the footprint
        # above) are lethal no matter what, and that is just geometry. What it controls is
        # how much the space BEYOND that is penalised.
        # 0.25 m leaves only ~8 cm of gradient past the inscribed radius (upstream: 0.55,
        # i.e. 33 cm of penalty on a robot 33 cm wide), and a cost_scaling_factor of 10
        # instead of 3 makes cost decay e^-10d, collapsing within a few centimetres. The
        # result is a faint preference for the middle of a gap that is instantly given up
        # when the gap is tight, instead of a planner that treats a doorway as a wall.
        inflation_radius: 0.25
        cost_scaling_factor: 10.0

# ------------------------------------------------------------------------------------
# global_costmap — the map plus live lidar, drives the planner
# ------------------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      # 1 Hz matches the replanning rate in the default behavior tree, and this is the
      # one cost that scales with map AREA rather than with motion.
      update_frequency: 1.0
      publish_frequency: 1.0
      # True with local for Foxglove; TODO: False again for CPU (see local_costmap note).
      always_send_full_costmap: True
      # 0.5 for the same reason as the controller above: global_frame is map, so every
      # pose lookup here inherits slam_toolbox's bursty map->odom.
      transform_tolerance: 0.5

      # ⚠ THIS VALUE IS VERY NEARLY COSMETIC. StaticLayer resizes the master grid to
      # whatever resolution the incoming /map has, so the global costmap inherits
      # slam.yaml's `resolution: 0.05` regardless of what is written here. It is set to
      # match only so the two files do not appear to disagree. If pipe planning ever
      # needs finer global cells, change it in slam.yaml — here it does nothing.
      resolution: 0.05

      # Same polygon and zero padding as the local costmap; see the long note there.
      footprint: "[[0.169, 0.167], [0.169, -0.167], [-0.169, -0.167], [-0.169, 0.167]]"
      footprint_padding: 0.0

      # Unmapped cells stay NO_INFORMATION rather than being assumed free, which is what
      # makes the planner's allow_unknown a deliberate choice instead of an accident.
      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "stvl_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # slam_toolbox latches /map transient-local; without this the costmap would wait
        # for the next periodic republish (0.5 Hz) before it had a map at all.
        map_subscribe_transient_local: True

      # Live returns on top of the map, so furniture that moved since the map was built
      # still blocks a plan. Longer ranges than the local costmap because this grid is
      # the whole map, but nowhere near the lidar's 16 m — beyond a few metres the map
      # itself is the better source and raytracing that far is wasted work.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: True
        combination_method: 1
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          # Same chair-leg flicker damping as the local costmap; 2.0 s here because this
          # costmap only updates at 1 Hz.
          observation_persistence: 2.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: false

      # Under-lidar band + clutter memory via STVL (2026-08-24, replaced the
      # depth_mark/depth_clear pair AND the /clutter_points source from the
      # retired Python clutter_mapper node). One persistent-while-running voxel
      # grid: marks in the 0.05–0.22 m band survive 4 h unseen (voxel_decay),
      # so global planning routes around shoes/toys/thresholds seen anywhere
      # the camera has looked — but inside the camera's live frustum decay is
      # sharply accelerated, so re-observing where a shoe was frees the cells
      # in ~a second (the old depth_clear semantics). Memory dies with the
      # nav2 process; that is the accepted trade vs the old clutter.npz.
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_decay: 14400.0     # 4 h: clutter memory while the stack runs
        decay_model: 0           # linear (NOT -1: frustum clearing must win)
        voxel_size: 0.05         # match this costmap's resolution
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: True
        combination_method: 1
        obstacle_range: 1.2
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: depth
        depth:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 0.22
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
          vertical_fov_angle: 1.012
          horizontal_fov_angle: 1.518
          # High acceleration: inside the live frustum the 4 h decay collapses
          # to ~a second, so seen-empty space clears immediately.
          decay_acceleration: 10.0
          model_type: 0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Must stay in step with the local costmap's, or the planner and the controller
        # disagree about how expensive it is to hug a wall. Same reasoning as there.
        inflation_radius: 0.25
        cost_scaling_factor: 10.0
        # ⚠ inflate_around_unknown was tried here (2026-08-24) and REVERTED: it does not
        # inflate lethal cells into adjacent unknown — it treats EVERY unknown cell as an
        # inflation SOURCE, so the entire unexplored map turned lethal (measured: 273k
        # unknown cells -> cost 100) and allow_unknown planning died. Unknown cells within
        # the inscribed radius of a lethal cell already receive INSCRIBED cost by default,
        # so sub-footprint wall gaps are already closed without it.

# ------------------------------------------------------------------------------------
# planner_server — global path from the current pose to the goal
# ------------------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: false
    # Warn if a planning cycle is slower than this. 1.0 to match the behavior tree's 1 Hz
    # replanning, rather than upstream's 20.0 which just fills the log on a Pi.
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # NavFn/Dijkstra: cheapest thing that works, and grid-optimal on a robot that can
      # pivot in place, so the staircase paths it produces cost nothing to follow.
      # Alternatives already present in the image if this proves inadequate:
      # nav2_smac_planner/SmacPlanner2D (same problem, better tie-breaking) and
      # nav2_theta_star_planner/ThetaStarPlanner (any-angle, straighter corridors).
      plugin: "nav2_navfn_planner/NavfnPlanner"
      use_astar: false
      # How far from the requested goal the planner may stop if the goal itself is
      # unreachable. 0.25 m rather than 0.5: half a metre short is a whole robot short.
      tolerance: 0.25
      # Plan into unmapped space. Required for exploring a pipe that was never mapped;
      # the local costmap and ObstacleFootprint are what keep that safe.
      allow_unknown: true

# ------------------------------------------------------------------------------------
# smoother_server — optional path smoothing, unused by the default behavior tree
# ------------------------------------------------------------------------------------
# The default navigate_to_pose tree never calls SmoothPath, so this node sits idle. It is
# configured anyway because the lifecycle manager brings it up regardless and an
# unconfigured lifecycle node fails the whole activation sequence.
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# ------------------------------------------------------------------------------------
# behavior_server — recovery behaviors (spin, back up, wait)
# ------------------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1

    # ⚠ THIS IS A cmd_vel PUBLISH RATE, and this server publishes /cmd_vel DIRECTLY,
    # bypassing velocity_smoother entirely (navigation_launch.py remaps the controller
    # and the smoother, not this node). So upstream's 10.0 would drive the robot at
    # exactly the cadence CLAUDE.md measured as making things worse — the driver's
    # per-command distance cap starts braking before the next command lands. 20 Hz puts
    # recoveries in the recommended 20-50 Hz band.
    cycle_frequency: 20.0

    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    # Abort the behavior if the footprint would hit something within 2 s of continuing.
    simulate_ahead_time: 2.0
    # Matches the controller's max_vel_theta and the shim's pivot rate (2.0 for the
    # deflated tires' 1.6-1.9x pivot scrub; see the shim comment).
    max_rotational_vel: 2.0
    # Above the ~0.35 rad/s in-place tracking floor, so the tail of a Spin still moves.
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.5

# ------------------------------------------------------------------------------------
# waypoint_follower — sequences NavigateToPose goals. Unused so far; goals come one at a
# time from Foxglove. Configured because the lifecycle manager manages it.
# ------------------------------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# ------------------------------------------------------------------------------------
# velocity_smoother — last stop before the motors: /cmd_vel_nav in, /cmd_vel out
# ------------------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: false

    # ⚠ THIS IS WHAT FEEDS THE ROBOCLAW'S 200 ms DEADMAN, and it is why the controller can
    # run slower than the required command rate: the smoother interpolates its own output
    # at 30 Hz between the controller's 15 Hz commands. 30 Hz is inside CLAUDE.md's
    # recommended 20-50 Hz band and matches the driver's odometry rate. Do not drop it
    # near 5 Hz "because the controller is slower" — the motors would free-wheel between
    # commands.
    smoothing_frequency: 30.0
    feedback: "OPEN_LOOP"
    # Clamp each axis independently rather than scaling the pair. Scaling would preserve
    # the commanded curvature at the cost of speed; for now, honest clamping is easier to
    # reason about, and the limits below are never actually reached.
    scale_velocities: False

    # Must not be tighter than the controller's own limits or the smoother silently
    # contradicts DWB's plan. Reverse is allowed here even though DWB does not currently
    # request it.
    max_velocity: [0.6, 0.0, 1.2]
    min_velocity: [-0.6, 0.0, -1.2]
    max_accel: [1.5, 0.0, 2.5]
    max_decel: [-2.0, 0.0, -2.5]

    odom_topic: "/odom"
    odom_duration: 0.1

    # ⚠ Zero on purpose. The obvious use for a deadband is the drivetrain's ~0.05 m/s
    # velocity-loop floor, but this is the wrong place for it: the deadband would also
    # zero every ramp step on the way up through those values, and it acts per axis so it
    # would kill fine yaw corrections during a straight run. The floor is enforced in
    # DWB's min_speed_xy/min_speed_theta instead, where it can consider both axes at once.
    deadband_velocity: [0.0, 0.0, 0.0]

    # ⚠ How long the last command stays latched when the input goes silent. On timeout
    # the smoother ramps to zero and publishes one stop, so this is the window in which a
    # crashed or killed controller_server keeps the robot moving: 0.5 s at 0.6 m/s is
    # ~30 cm of coast. Upstream's 1.0 s is twice that.
    # It also fires at the START of every recovery behavior, since controller_server goes
    # quiet then — the resulting single zero Twist is a brief stutter before the behavior
    # server's own commands take over, and is harmless.
    # NOTE: none of this helps if the whole nav2 container is stopped mid-drive. Nothing
    # publishes zero then, and the RoboClaw deadman coasts (Free Wheeling) after 200 ms.
    velocity_timeout: 0.5
