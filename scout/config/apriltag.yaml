# Shared params for ALL apriltag_ros nodes (robot.launch.py starts one node
# per family — apriltag_ros detects a single family per instance, so reading
# every family means a fan-out). The wildcard key applies to every
# apriltag_* node; each node's `family` is set inline in the launch file.
#
# All nodes consume /apriltag/image_rect — the color stream throttled to
# 2 fps by topic_tools (9 families at 30 fps would eat a Pi core for
# nothing; the tag watcher polls every 2 s anyway).
#
# ⚠ `size` is what the node uses for TF pose distance. Registry size_m in
# /maps/tags.db is bookkeeping — a print at a different scale needs a
# per-node override (tag.ids/tag.sizes) here, or its standoff lands wrong.
# The doghouse print: 200 mm page, pose square 120 mm → 0.12.
/**:
  ros__parameters:
    image_transport: raw
    size: 0.12
    max_hamming: 0
    detector:
      threads: 1
      decimate: 2.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
