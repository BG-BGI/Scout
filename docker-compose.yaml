x-service: &base
  build: .
  image: ${DOCKER_IMAGE}
  network_mode: host
  ipc: host
  entrypoint: /ros_entrypoint.sh
  volumes:
    - .:/ros_ws/src/
    - ros_ws_build:/ros_ws/build
    - ros_ws_install:/ros_ws/install
    - ros_ws_log:/ros_ws/log
  privileged: true

services:

  build_package:
    <<: *base
    profiles: ["build"]
    command: colcon build --packages-up-to ${PACKAGE_NAME} --symlink-install

  led:
    <<: *base
    command: /ros_ws/install/scout/lib/scout/led_node

  # Run bare rather than through roboclaw_driver.launch.py, which adds nothing but
  # cannot remap: its /odom is the raw wheel estimate and /odom belongs to the fused
  # one from the EKF. The node hardcodes the topic name, so remapping is the only
  # lever, and --params-file works the same as the launch file's `parameters=` because
  # the node names itself roboclaw_driver, matching the key in roboclaw.yaml.
  roboclaw_driver:
    <<: *base
    command: >
      ros2 run roboclaw_driver roboclaw_driver_node --ros-args
      --params-file /ros_ws/src/scout/config/roboclaw.yaml
      -r /odom:=/wheel_odom

  joystick_teleop:
    <<: *base
    command: ros2 run scout joystick_teleop

  battery_monitor:
    <<: *base
    command: ros2 run scout battery_monitor

  camera:
    <<: *base
    command: >
      ros2 launch realsense2_camera rs_launch.py
      config_file:=/ros_ws/src/scout/config/realsense.yaml

  # Subtracts gyro bias and keeps re-estimating it as the sensor warms.
  gyro_calibrator:
    <<: *base
    command: >
      ros2 run scout gyro_calibrator --ros-args
      -r imu_in:=/camera/camera/imu
      -r imu_out:=/imu/data

  lidar:
    <<: *base
    command: >
      ros2 run rplidar_ros rplidar_node --ros-args
      --params-file /ros_ws/src/scout/config/rplidar.yaml

  # Fuses /wheel_odom (forward speed) with /imu/data (yaw rate) into the /odom that
  # everything else should use, and publishes odom->base_link.
  ekf:
    <<: *base
    command: >
      ros2 run robot_localization ekf_node --ros-args
      --params-file /ros_ws/src/scout/config/ekf.yaml
      -r /odometry/filtered:=/odom

  # Occupancy grid mapping from /scan, publishing /map and map->odom. Needs the whole
  # odometry chain up first (lidar, ekf, robot_description, camera, gyro_calibrator).
  # `up slam` starts a fresh map; the other two modes override the command, e.g.
  #   docker compose run --rm slam ros2 launch scout slam.launch.py mode:=continue map:=house
  slam:
    <<: *base
    # command: ros2 launch scout slam.launch.py mode:=new
    command: ros2 launch scout slam.launch.py mode:=localization map:=house
    # command: ros2 launch scout slam.launch.py mode:=continue map:=house

  # Path planning and following. Needs `slam` up first for /map and map->odom, which
  # means the whole odometry chain before that. Reuses upstream's navigation_launch.py
  # (as `camera` reuses rs_launch.py) because it owns the cmd_vel plumbing: it remaps
  # controller_server's output to /cmd_vel_nav and velocity_smoother's back to /cmd_vel,
  # so the driver needs no change. It also deliberately omits map_server and amcl --
  # slam_toolbox fills both roles.
  #
  # ⚠ Goals come from Foxglove on /goal_pose (frame_id: map), and THERE IS NO CANCEL
  # BUTTON. An accepted goal lives in bt_navigator, which replans at 1 Hz and keeps
  # streaming cmd_vel until it arrives -- killing whatever sent the goal does NOT stop
  # it. `docker compose restart nav2` is what clears one. Note that `docker stop` here
  # leaves the last command latched for up to velocity_timeout (0.5 s) and the deadman
  # then only coasts, so it is a way to end navigation, not a way to brake.
  nav2:
    <<: *base
    command: >
      ros2 launch nav2_bringup navigation_launch.py
      params_file:=/ros_ws/src/scout/config/nav2.yaml
      use_sim_time:=false

  robot_description:
    <<: *base
    command: ros2 launch scout description.launch.py

  foxglove_bridge:
    <<: *base
    # network_mode: bridge  # only in WSL
    # ports: ["8765:8765"]  # only in WSL
    command: ros2 run foxglove_bridge foxglove_bridge

volumes:
  ros_ws_build:
  ros_ws_install:
  ros_ws_log: