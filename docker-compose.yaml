x-service: &base
  build: .
  image: ${DOCKER_IMAGE}
  network_mode: host
  ipc: host
  entrypoint: /ros_entrypoint.sh
  volumes:
    - .:/ros_ws/src/
    - ros_ws_build:/ros_ws/build
    - ros_ws_install:/ros_ws/install
    - ros_ws_log:/ros_ws/log
  privileged: true

services:

  build_package:
    <<: *base
    profiles: ["build"]
    command: colcon build --packages-select ${PACKAGE_NAME} --symlink-install

  test:
    <<: *base
    profiles: ["test"]
    command: python3 /ros_ws/src/scout/scout/motor_test.py

  roboclaw_driver:
    <<: *base
    command: ros2 launch roboclaw_driver roboclaw_driver.launch.py config_file:=/ros_ws/src/scout/config/roboclaw.yaml

  joystick_teleop:
    <<: *base
    command: ros2 run scout joystick_teleop

  foxglove_bridge:
    <<: *base
    # network_mode: bridge  # only in WSL
    # ports: ["8765:8765"]  # only in WSL
    command: ros2 run foxglove_bridge foxglove_bridge

volumes:
  ros_ws_build:
  ros_ws_install:
  ros_ws_log: